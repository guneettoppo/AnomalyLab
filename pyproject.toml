[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anomalylab"
version = "1.0.0"
description = "Anomaly detection on the NAB corpus with a label-free deployable threshold and operator-facing metrics"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Guneet Toppo" }]
keywords = ["anomaly-detection", "time-series", "nab", "benchmark", "unsupervised"]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://github.com/guneettoppo/AnomalyLab"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
